<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07110e" />

    <title>WHYRO — Build. Collaborate. Innovate.</title>

    <meta
      name="description"
      content="WHYRO is a community for people who build. Discover projects, share your work, and collaborate with creators."
    />

    <link rel="canonical" href="https://whyro.online/" />

    <!-- WHYRO brand identity -->
    <meta property="og:site_name" content="WHYRO" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="WHYRO — Build. Collaborate. Innovate."
    />
    <meta
      property="og:description"
      content="Discover projects, share your work, and build with a community of creators."
    />
    <meta property="og:url" content="https://whyro.online/" />

    <!-- Tell search engines the preferred website name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "WHYRO",
        "alternateName": "whyro.online",
        "url": "https://whyro.online/"
      }
    </script>

    <!-- WHYRO favicon -->
    <link rel="icon" type="image/svg+xml" href="/whyro-mark.svg" />
    <link rel="apple-touch-icon" href="/whyro-mark.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
